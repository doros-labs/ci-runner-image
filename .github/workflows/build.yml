# Builds the runner image and publishes it to GHCR.
#
#   smoke (pull requests and main): content denylist, build WITHOUT pushing, no registry
#     login, no secret; then the smoke check inside the hardened container (no network) and
#     the native-addon check (same container flags, but with network: npm ci needs the registry).
#   build (pushes to main only): build again and push with the job's own GITHUB_TOKEN
#     (packages: write on this job only), then pull the pushed digest and run the same two
#     checks on it. The digest goes to the run summary; consumers pin that digest, never a tag.
#
# This repository is public: no job checks out or tests a private repository, and no job
# uses pull_request_target. Third-party actions are pinned by commit SHA.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ci-runner

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Content denylist (fails the build on internal content)
        run: python3 -B tools/denylist-check.py .
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Base image digests (pin the tag-only ones from here)
        run: |
          set -euo pipefail
          node_major="$(sed -n 's/^ARG NODE_MAJOR=//p' Dockerfile | head -1)"
          {
            echo "### Base images"
            for ref in "node:${node_major}-slim" "$(sed -n 's/^FROM \(ghcr.io\/actions\/actions-runner:[^@ ]*\).*/\1/p' Dockerfile)"; do
              echo "- ${ref}: $(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest.Digest}}')"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ci-runner-smoke:local
      - name: Smoke in the hardened container
        run: bash tools/run-smoke.sh ci-runner-smoke:local
      - name: Native addon with a prebuilt binary installs (npm ci) and loads
        run: bash tools/run-addon-check.sh ci-runner-smoke:local
      - name: No sudo even without no-new-privileges
        run: |
          set +e
          docker run --rm --user 1001:1001 --entrypoint sh ci-runner-smoke:local -c 'command -v sudo >/dev/null || exit 3; sudo -n true'
          rc=$?
          set -e
          # 0 = sudo works; 3 = no sudo binary (dash's `command -v` itself returns 127 for a missing
          # command, so absence gets its own code); 125-127 = docker itself or the shell failed, not a
          # verdict on sudo; any other code = sudo is there but refuses uid 1001.
          if [ "$rc" -eq 0 ]; then echo "sudo works for uid 1001"; exit 1; fi
          if [ "$rc" -ge 125 ]; then echo "docker run failed (rc $rc)"; exit 1; fi
          if [ "$rc" -eq 3 ]; then echo "no sudo binary for uid 1001"; else echo "sudo refuses uid 1001 (rc $rc)"; fi
      - name: Size and package list
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Compared with the last published image (the latest tag moves only after a main build
          # passed its smoke), so a change's size cost shows in its own run.
          new="$(docker image inspect ci-runner-smoke:local --format '{{.Size}}')"
          prev_ref="ghcr.io/${OWNER}/${IMAGE_NAME}:latest"
          if docker pull -q "${prev_ref}" >/dev/null 2>&1; then
            prev="$(docker image inspect "${prev_ref}" --format '{{.Size}}')"
            size_line="$(awk -v n="${new}" -v p="${prev}" -v r="${prev_ref}" 'BEGIN { printf "image size: %.2f GB (%.0f bytes); %s: %.2f GB (%.0f bytes); delta %+.1f MB", n/1e9, n, r, p/1e9, p, (n-p)/1e6 }')"
          else
            size_line="$(awk -v n="${new}" -v r="${prev_ref}" 'BEGIN { printf "image size: %.2f GB (%.0f bytes); could not pull %s (none published yet, or not public), no comparison", n/1e9, n, r }')"
          fi
          echo "${size_line}"
          {
            echo "${size_line}"
            echo "<details><summary>dpkg packages</summary>"; echo; echo '```'
            docker run --rm --entrypoint dpkg-query ci-runner-smoke:local -W -f '${Package} ${Version}\n'
            echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and push
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push by digest only; the human-readable tags move after the smoke passed on that digest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Smoke the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${OWNER}/${IMAGE_NAME}@${DIGEST}"
          docker pull "${ref}"
          bash tools/run-smoke.sh "${ref}"
          bash tools/run-addon-check.sh "${ref}"
      - name: Tag the smoked digest (latest, sha-<commit>)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="ghcr.io/${OWNER}/${IMAGE_NAME}"
          docker buildx imagetools create -t "${base}:latest" -t "${base}:sha-${SHA}" "${base}@${DIGEST}"
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "Pin: ghcr.io/${OWNER}/${IMAGE_NAME}@${DIGEST} (smoke passed on this digest)" | tee -a "$GITHUB_STEP_SUMMARY"
